name: Publish GUI Skill release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package GUI skill
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,zipfile
          out = pathlib.Path('LChatAi-GUI-Super-Skill-v1.0.0.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED) as z:
              for p in pathlib.Path('.').rglob('*'):
                  if not p.is_file() or '.git' in p.parts or p == out:
                      continue
                  z.write(p, p.as_posix())
          print('Created',out,'size',out.stat().st_size)
          PY
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 \
            ./LChatAi-GUI-Super-Skill-v1.0.0.zip \
            --title "LChatAi GUI Super Skill v1.0.0" \
            --notes "GUI-only design skill, 10 individual editable SVG references, design tokens, AI naming, branding, microcopy and source links." \
            --target "${{ github.sha }}"
